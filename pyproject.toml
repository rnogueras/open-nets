[project]
name = "open-nets"
version = "0.1.0"
description = "Open Neural Networks"
authors = [
    {name = "Roberto Nogueras Zondag"}
]
license = {text = "Apache"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.1,<3.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.11,<0.15.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]
